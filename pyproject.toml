[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "task-manager"
version = "0.1.0"
description = "Task Manager API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "uuid7>=0.1.0",
    "redis[hiredis]>=5.2.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "ldap3>=2.9.1",
    "babel>=2.16.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-playwright>=0.5.0",
    "httpx>=0.28.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "pip-licenses>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --- Ruff (Lint + Format) ---
[tool.ruff]
target-version = "py312"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "S", "T20"]
ignore = [
    "S101",
    # FastAPI の標準 DI パターン（Depends(...) をデフォルト値に置く）を許容
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# --- mypy (strict) ---
[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_explicit = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["uuid7.*"]
ignore_missing_imports = true

# --- pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

# --- coverage ---
[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
